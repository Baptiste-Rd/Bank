name: Captures d'écran

# Lance l'app en mode démo sur un émulateur Android et publie les captures sur la branche
# « screenshots », dans un dossier par commit. Sert à vérifier le rendu sans téléphone.
on:
  push:
    branches: ['poc/**', 'ui/**', 'feature/**']
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK de debug
        run: ./gradlew :app:assembleDebug

      - name: Activer KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Captures sur émulateur (Android 14, Pixel 7)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Tests sur l'appareil d'abord (migrations de la base), puis les captures.
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            ./scripts/screenshots.sh app/build/outputs/apk/debug/app-debug.apk shots

      # Un test sur l'appareil qui échoue : son message en annotation, lisible sans les journaux.
      - name: Résumé des tests sur l'appareil
        if: failure()
        run: |
          summary=$(grep -rh -A3 "<failure" app/build/outputs/androidTest-results 2>/dev/null | head -40 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Tests sur l'appareil::${summary:-aucun rapport}"

      # Schémas de la base exportés par Room : référence des tests de migration (app/schemas).
      - name: Joindre les schémas de la base
        run: |
          mkdir -p shots
          cp -r app/schemas shots/schemas || true

      - name: Publier sur la branche screenshots
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: screenshots
          publish_dir: shots
          destination_dir: ${{ github.sha }}
          keep_files: true
