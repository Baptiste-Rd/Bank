name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Nécessaire pour publier la release lue par la mise à jour intégrée.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et APK de debug
        run: |
          set -o pipefail
          ./gradlew :domain:test :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log

      # Remonte les erreurs de compilation en annotation, lisible sans ouvrir les journaux.
      - name: Résumé des erreurs
        if: failure()
        run: |
          summary=$(grep -E "^e: |error:|What went wrong|FAILED|> " build.log | head -60 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build::${summary}"

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: bank-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Chaque push sur main publie une release « build-N ». L'app compare N à son propre
      # versionCode (le même numéro d'exécution) pour proposer la mise à jour.
      - name: Publier la release pour la mise à jour intégrée
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bank-debug.apk
          gh release create "build-${{ github.run_number }}" bank-debug.apk \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "$COMMIT_MESSAGE" \
            --latest
