name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du domaine et APK de debug
        run: ./gradlew :domain:test :app:assembleDebug --stacktrace

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: bank-debug-apk
          path: app/build/outputs/apk/debug/*.apk
